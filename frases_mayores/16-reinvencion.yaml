# Capítulo 16 · Empezar de nuevo a los setenta
tema: reinvencion
capitulo: 16
eje: apoyo
titulo: Empezar de nuevo a los setenta
hashtags: [reinvencion, proposito, cambio]
tesis: >-
  La jubilación no tiene por qué ser un punto final. Para muchas personas es
  el momento de empezar algo que antes no había tiempo de hacer, y la
  investigación encuentra que ese tipo de reinvención se asocia a mejor
  bienestar. Este capítulo es sobre animarse a empezar de nuevo, con lo que
  los datos encuentran.

frases:
  - id: rei-01
    texto: "Trabajar algunas horas después de jubilarse se asocia a mejor ajuste que dejar todo de golpe."
    destacar: [algunas horas]
    principio: "El empleo puente -trabajar en forma parcial o distinta tras la jubilación formal- se asocia a una transición más satisfactoria que el retiro total abrupto."
    fuente: "Kim y Feldman (2000), estudio sobre empleo puente y satisfacción con el retiro."
    reflexion: >-
      No hace falta elegir entre trabajar a tiempo completo o no hacer nada.
      Muchas personas encuentran su mejor versión de esta etapa en un punto
      intermedio: menos horas, otra actividad, algo elegido en vez de
      impuesto. Ese tipo de transición gradual suele sentirse mejor que el
      corte abrupto del último día de trabajo.

  - id: rei-02
    texto: "Una actividad nueva después de jubilarse no tiene que parecerse al trabajo anterior."
    destacar: [nueva]
    principio: "Las personas que exploran roles distintos de su ocupación previa tras la jubilación reportan mayor satisfacción que quienes intentan replicar su vida laboral."
    fuente: "Wang, Henkens y van Solinge (2011), revisión sobre adaptación a la jubilación."
    reflexion: >-
      El abogado no tiene que seguir siendo abogado de algún modo, ni la
      maestra seguir enseñando. Esta etapa puede ser justo la oportunidad de
      probar algo que no tiene nada que ver con lo anterior: una huerta, un
      oficio manual, un voluntariado distinto. Cuanto más distinto, a veces
      más fresco se siente.

  - id: rei-03
    texto: "El miedo a no servir para algo nuevo baja apenas se empieza a practicar."
    destacar: [practicar]
    principio: "La autoeficacia percibida para una tarea nueva aumenta con la experiencia directa de pequeños logros, más que con la reflexión previa sobre la propia capacidad."
    fuente: "Bandura (1997), teoría de la autoeficacia."
    reflexion: >-
      Pensar «ya no tengo edad para esto» antes de probar algo es la parte
      que más frena, y es también la que menos tiene que ver con la
      capacidad real. La confianza para hacer algo nuevo no viene antes de
      empezar: viene DESPUÉS de los primeros intentos, por chicos que sean.
      Hay que empezar para saber si se puede, no al revés.

  - id: rei-04
    texto: "Aprender un oficio nuevo a los setenta lleva más tiempo, no menos resultado final."
    destacar: [más tiempo]
    principio: "La velocidad de adquisición de nuevas habilidades disminuye con la edad, pero el nivel de competencia final alcanzable no está limitado por la edad en tareas bien practicadas."
    fuente: "Park y colegas (2014), estudio Synapse sobre aprendizaje de habilidades en la vejez."
    reflexion: >-
      Comparar el ritmo de aprendizaje propio con el de alguien de veinte
      años es la trampa que más desanima. Tarda más, es cierto. Pero el
      lugar al que se llega con práctica sostenida no tiene techo puesto por
      la edad. La paciencia con el propio ritmo es parte del trato.

  - id: rei-05
    texto: "Las segundas carreras elegidas por gusto, no por necesidad, dan más satisfacción."
    destacar: [por gusto]
    principio: "Las actividades posteriores a la jubilación motivadas por interés intrínseco predicen mayor satisfacción que las motivadas por necesidad económica o presión externa."
    fuente: "Moen y Flood (2013), estudio sobre generatividad en la mediana edad y después."
    reflexion: >-
      No es lo mismo volver a trabajar porque hace falta la plata que
      empezar algo nuevo porque da ganas. Las dos cosas pueden coexistir,
      pero cuando hay margen para elegir por gusto, el resultado en
      bienestar es mejor. Si se puede, vale la pena que la nueva actividad
      sea una que de verdad se eligió.

  - id: rei-06
    texto: "El primer paso de algo nuevo no tiene que ser grande. Alcanza con que sea real."
    destacar: [real]
    principio: "El establecimiento de metas pequeñas y alcanzables aumenta la probabilidad de sostener un cambio de actividad a largo plazo."
    fuente: "Locke y Latham (2002), teoría del establecimiento de metas."
    reflexion: >-
      No hace falta anotarse en el curso más largo ni comprar todo el equipo
      de una vez. Un primer paso chico -ir a mirar una clase, hablar con
      alguien que ya lo hace- es lo que de verdad arranca algo nuevo. Los
      proyectos que empiezan grandes suelen apagarse rápido; los que
      empiezan chicos tienen más chance de seguir.
