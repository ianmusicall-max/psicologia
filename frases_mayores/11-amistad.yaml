# Capítulo 11 · Hacer amigos nuevos a esta edad
tema: amistad
capitulo: 11
eje: apoyo
titulo: Hacer amigos nuevos a esta edad
hashtags: [amistad, vinculos, conexion]
tesis: >-
  El círculo se achica con los años, y eso lleva a pensar que ya no se hacen
  amigos nuevos. No es así: lo que cambia es el criterio, no la capacidad.
  Este capítulo es sobre esa diferencia, y sobre qué hace que un vínculo
  nuevo prospere a esta edad.

frases:
  - id: amg-01
    texto: "Sí se hacen amigos nuevos después de los setenta. Se eligen distinto, no se dejan de hacer."
    destacar: [distinto]
    principio: "La red social se reorganiza con la edad según un criterio de calidad más que de cantidad, sin que eso implique incapacidad para formar vínculos nuevos."
    fuente: "Antonucci y Akiyama (1987), modelo del convoy social."
    reflexion: >-
      La idea de que a cierta edad ya no se hacen amigos confunde dos cosas:
      el tamaño del círculo y la capacidad de ampliarlo. Lo primero baja, lo
      segundo no. Lo que cambia es el filtro: se elige con más cuidado con
      quién vale la pena invertir tiempo, y eso no es cerrarse, es afinar la
      puntería.

  - id: amg-02
    texto: "Las amistades que se hacen por actividad compartida suelen ser las que mejor duran."
    destacar: [compartida]
    principio: "Las amistades surgidas de contextos de actividad compartida y encuentro regular tienden a sostenerse más que las surgidas de un solo evento."
    fuente: "Blieszner (2006), revisión sobre amistad en la vejez."
    reflexion: >-
      No hace falta buscar un amigo como quien busca pareja. Un taller, un
      grupo de caminata, una actividad del barrio donde se repite el
      encuentro semana tras semana da más oportunidad de que un vínculo
      prospere que una sola charla. El tiempo compartido, aunque sea en
      silencio haciendo algo juntos, es lo que construye la confianza.

  - id: amg-03
    texto: "Una amistad nueva no reemplaza a las de toda la vida: suma a otro lugar distinto."
    destacar: [suma]
    principio: "Las distintas relaciones del convoy social cumplen funciones diferentes y complementarias; una no sustituye a la otra."
    fuente: "Antonucci y Akiyama (1987), mismo modelo del convoy social."
    reflexion: >-
      El amigo de toda la vida sabe la historia completa. El vecino nuevo del
      taller de cerámica sabe otra cosa: cómo es uno hoy, en esta etapa. Las
      dos clases de vínculo cumplen funciones distintas, y no compiten entre
      sí. No hace falta que un amigo nuevo iguale al de cincuenta años para
      que valga la pena.

  - id: amg-04
    texto: "Mostrarse tal cual uno es, sin maquillar nada, es lo que más acerca a un vínculo nuevo."
    destacar: [mostrarse]
    principio: "La autorrevelación recíproca -compartir información personal genuina- es uno de los predictores más consistentes del desarrollo de la intimidad en una amistad."
    fuente: "Collins y Miller (1994), metaanálisis sobre autorrevelación y agrado."
    reflexion: >-
      Contar algo real de uno mismo -una preocupación, una alegría concreta,
      no solo el clima- es lo que convierte un conocido en un amigo. Cuesta
      más al principio, sobre todo si hace tiempo que no se practica. Pero es
      lo que de verdad acerca, mucho más que cualquier charla cortés que no
      dice nada.

  - id: amg-05
    texto: "La soledad baja más con un amigo cercano que con diez conocidos."
    destacar: [cercano]
    principio: "La calidad de los vínculos sociales predice el bienestar más que su cantidad; un vínculo íntimo pesa más que varios vínculos superficiales."
    fuente: "Holt-Lunstad, Smith y Layton (2010), metaanálisis sobre relaciones sociales y mortalidad."
    reflexion: >-
      No hace falta un círculo grande. Un solo vínculo donde se puede ser
      sincero cambia más la sensación de soledad que muchos conocidos
      amables. Si el objetivo es sentirse acompañado, conviene invertir en
      profundizar uno o dos vínculos en vez de intentar sumar contactos.

  - id: amg-06
    texto: "Animarse a proponer un plan, aunque dé vergüenza, suele salir mejor de lo que se teme."
    destacar: [animarse]
    principio: "El sesgo de subestimación del agrado (liking gap): las personas tienden a subestimar cuánto les cayeron bien a otros tras una interacción nueva."
    fuente: "Boothby, Cooney, Sandstrom y Clark (2018), estudio sobre el liking gap."
    reflexion: >-
      Después de charlar con alguien nuevo, casi todos creen haber causado
      peor impresión de la que en realidad causaron. Ese es un sesgo medido,
      no una corazonada. Así que si dio vergüenza proponer un café o volver a
      saludar, probablemente a la otra persona también le gustó más de lo que
      uno cree. Vale la pena dar el paso.
