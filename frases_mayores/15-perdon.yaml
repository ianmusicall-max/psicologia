# Capítulo 15 · Perdonar no es para el otro
tema: perdon
capitulo: 15
eje: apoyo
titulo: Perdonar no es para el otro
hashtags: [perdon, emociones, paz]
tesis: >-
  Con los años hay más historia detrás: más ofensas viejas, más cuentas sin
  cerrar. Lo que la investigación sobre perdón encuentra es que perdonar no
  es aprobar lo que pasó ni es un favor para quien ofendió: es un proceso que
  libera a quien lo hace, y tiene sus propios pasos.

frases:
  - id: pdo-01
    texto: "Perdonar no es decir que lo que pasó estuvo bien. Es soltar el peso de seguir cargándolo."
    destacar: [soltar]
    principio: "El perdón se distingue de la reconciliación y de la justificación del daño: es un cambio interno que reduce el resentimiento sin requerir aprobar lo ocurrido."
    fuente: "Enright y Fitzgibbons (2000), modelo del proceso de perdón."
    reflexion: >-
      Perdonar confunde a mucha gente porque suena a decir «no importa».
      No es eso. Es dejar de llevar esa ofensa como una carga diaria, aunque
      siga estando mal lo que pasó. Las dos cosas pueden ser ciertas a la
      vez: algo estuvo mal, y uno elige no seguir cargándolo.

  - id: pdo-02
    texto: "Las personas mayores tienden a perdonar más que las jóvenes, y eso les cuida la salud."
    destacar: [salud]
    principio: "La disposición al perdón aumenta con la edad y se asocia a mejores indicadores de salud mental en adultos mayores."
    fuente: "Toussaint, Williams, Musick y Stanislav (2001), estudio sobre perdón y salud a través del ciclo vital."
    reflexion: >-
      Con los años, en promedio, se perdona más fácil que a los veinte. Y no
      es solo un cambio de carácter: ese perdón se asocia a mejor salud
      mental, menos síntomas de ansiedad y depresión. Dejar ir rencores
      viejos no es debilidad, es algo que el propio cuerpo agradece.

  - id: pdo-03
    texto: "Perdonar no exige que la persona vuelva a la vida de uno. Son decisiones distintas."
    destacar: [distintas]
    principio: "El perdón y la reconciliación son procesos independientes: se puede perdonar sin restablecer el vínculo con quien ofendió."
    fuente: "Worthington (2005), modelo REACH del perdón."
    reflexion: >-
      Mucha gente no perdona porque cree que eso obliga a volver a tener
      cerca a quien hizo daño. No es así. Se puede soltar el rencor y, al
      mismo tiempo, decidir mantener distancia. Perdonar es algo que pasa
      adentro; dejar entrar de nuevo a alguien es otra decisión, aparte.

  - id: pdo-04
    texto: "El rencor sostenido se asocia a más presión arterial y peor sueño."
    destacar: [presión]
    principio: "Sostener resentimiento activa de forma prolongada respuestas fisiológicas de estrés, con efectos medibles sobre la presión arterial y el sueño."
    fuente: "Witvliet, Ludwig y Vander Laan (2001), estudio sobre perdón y respuesta fisiológica."
    reflexion: >-
      Cuando a alguien se le pide recordar una ofensa sin perdonarla, el
      cuerpo reacciona como ante una amenaza: sube la presión, se tensa el
      cuerpo. Cuando se le pide imaginar el perdón, esas respuestas bajan. El
      rencor no se queda solo en la cabeza: se nota en el cuerpo, todos los
      días que se lo sostiene.

  - id: pdo-05
    texto: "Perdonarse a uno mismo por algo del pasado sigue el mismo proceso que perdonar a otro."
    destacar: [mismo]
    principio: "El autoperdón comparte los mecanismos psicológicos del perdón interpersonal y es un predictor independiente de bienestar."
    fuente: "Hall y Fincham (2005), estudio sobre autoperdón."
    reflexion: >-
      Hay errores propios que se cargan durante años: una decisión que se
      arrepiente, una palabra que no se debió decir. Perdonarse por eso no
      es excusarse sin más: sigue el mismo camino que perdonar a otro,
      reconocer el daño y después soltar el peso. Cuesta, y también se
      puede aprender a hacerlo.

  - id: pdo-06
    texto: "El perdón no tiene fecha límite. Llegar tarde a él no lo vuelve menos válido."
    destacar: [fecha]
    principio: "El perdón puede procesarse en cualquier momento de la vida, incluidas ofensas de décadas atrás, con beneficios similares a los del perdón más temprano."
    fuente: "Enright y Fitzgibbons (2000), mismo modelo del proceso de perdón."
    reflexion: >-
      Hay ofensas de hace cuarenta años que todavía pesan, y la pregunta de
      «¿no es tarde para esto?» no tiene mucho sentido. El perdón no vence.
      Procesarlo ahora, con toda la distancia que dio el tiempo, puede ser
      incluso más claro que hacerlo en caliente. Nunca es tarde para
      soltar un peso que todavía se carga.
