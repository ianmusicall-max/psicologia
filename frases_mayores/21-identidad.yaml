# Capítulo 21 · Quién es uno cuando el trabajo ya no lo dice
tema: identidad
capitulo: 21
eje: apoyo
titulo: Quién es uno cuando el trabajo ya no lo dice
hashtags: [identidad, jubilacion, proposito]
tesis: >-
  Durante años, la respuesta a «quién sos» venía con el trabajo: médico,
  maestra, comerciante. Cuando eso se termina, hace falta reconstruir esa
  respuesta desde otro lugar. Este capítulo es sobre esa reconstrucción, que
  la investigación describe como un proceso normal y no como una crisis.

frases:
  - id: ide-01
    texto: "Perder el título del trabajo no es perder la identidad: es tener que reconstruirla desde otro lado."
    destacar: [reconstruirla]
    principio: "La transición a la jubilación implica un proceso normativo de reconstrucción identitaria, no una pérdida patológica de identidad."
    fuente: "Kim y Moen (2002), estudio sobre transiciones de jubilación e identidad."
    reflexion: >-
      Durante décadas, la pregunta «¿a qué te dedicás?» se contestaba sola.
      Cuando eso se termina, hace falta encontrar otra respuesta, y ese
      proceso puede sentirse incómodo al principio. No es un síntoma de
      algo mal: es el trabajo normal de reconstruir una parte de quién es
      uno, que antes el empleo resolvía por defecto.

  - id: ide-02
    texto: "Las mujeres que se jubilan de un trabajo con identidad fuerte lo reconstruyen con otras actividades con sentido."
    destacar: [reconstruyen]
    principio: "La reconstrucción identitaria tras la jubilación, especialmente en personas con fuerte identificación profesional previa, se logra mediante la adopción de nuevos roles significativos."
    fuente: "Price (2000), estudio sobre identidad posretiro en mujeres profesionales."
    reflexion: >-
      Para quien el trabajo fue una parte central de quién era, dejarlo
      puede sentirse como perder un pedazo de sí misma. El estudio encontró
      que quienes mejor lo atravesaban no reemplazaban ese vacío con
      descanso, sino con otra actividad que también tuviera sentido para
      ellas. La identidad necesita algo que la sostenga, sea lo que sea.

  - id: ide-03
    texto: "Uno es más cosas de las que el trabajo mostraba. Esta etapa puede sacarlas a la luz."
    destacar: [más cosas]
    principio: "El concepto de self posible describe las versiones de identidad que una persona podría llegar a desarrollar; la jubilación amplía el repertorio de selves accesibles."
    fuente: "Markus y Nurius (1986), teoría de los posibles yo."
    reflexion: >-
      El trabajo mostraba una parte de la persona, no todas. Quien fue
      contador puede descubrir, recién ahora, que también es de los que
      pintan, o enseñan, o cocinan para el barrio. Esas partes estaban,
      solo que no tenían tiempo ni lugar antes. Esta etapa puede ser la
      oportunidad de conocerlas.

  - id: ide-04
    texto: "Presentarse diciendo «fui» en vez de «soy» puede ser el primer paso hacia una identidad nueva."
    destacar: [primer paso]
    principio: "El lenguaje usado para referirse al rol laboral pasado, en pasado o en presente, refleja y refuerza el grado de integración de la nueva identidad posretiro."
    fuente: "Ashforth (2001), teoría de las transiciones de rol."
    reflexion: >-
      Hay quien sigue presentándose como «soy médico» años después de haber
      dejado de ejercer, y no es un error, es una señal de que esa
      identidad todavía no encontró su lugar nuevo. Animarse a decir «fui
      médico, y ahora...» y completar esa frase con algo propio es parte de
      construir la identidad que sigue.

  - id: ide-05
    texto: "El propio cuerpo también cambia de rol: de herramienta de trabajo a algo que simplemente se habita."
    destacar: [habita]
    principio: "La relación con el propio cuerpo se reorganiza tras la jubilación, pasando de instrumento funcional de trabajo a objeto de cuidado y experiencia presente."
    fuente: "Tulle (2008), estudio sobre cuerpo e identidad en la vejez."
    reflexion: >-
      Para quien trabajó con las manos o de pie todo el día, el cuerpo era
      sobre todo una herramienta. Cuando eso se termina, el cuerpo pasa a
      ser otra cosa: algo que se cuida, que se disfruta, que simplemente
      se habita sin exigirle rendimiento. Ese cambio de relación también es
      parte de la identidad que se reconstruye.

  - id: ide-06
    texto: "La identidad no se termina de armar una sola vez. Se sigue ajustando toda la vida."
    destacar: [toda la vida]
    principio: "El desarrollo identitario es un proceso continuo a lo largo de toda la vida adulta, incluida la vejez, y no un logro que se completa en una etapa temprana."
    fuente: "Whitbourne y Collins (1998), modelo del desarrollo identitario en la adultez."
    reflexion: >-
      La idea de que la identidad se arma de joven y después queda fija no
      se sostiene. Se sigue ajustando con cada etapa nueva: el primer
      trabajo, la crianza, la jubilación, y lo que venga después. No hace
      falta sentir que a esta altura ya debería estar todo resuelto. Nunca
      lo estuvo, para nadie, del todo.
