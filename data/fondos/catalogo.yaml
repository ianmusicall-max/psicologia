  #    luces, pero es el candidato a sacar si alguna vez molesta.
  # 2. Viene en 1080x1906 y no 1080x1920: es la unica medida distinta de la
  #    carpeta. Al encajarlo se agranda un 0,73% y se le recortan 8 px de
  #    ancho. No se ve.

