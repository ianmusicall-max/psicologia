persona-paraguas-calle.mp4:
  que_es: Alguien de espaldas camina con paraguas por una calle empedrada mojada
  etiquetas: [persona, espaldas, paraguas, lluvia, calle, caminar, soledad, seguir]
  # El unico donde una persona es el SUJETO, y de espaldas a proposito: una
  # cara mirando a camara se lleva la atencion que tiene que ir a la frase. De
  # espaldas, en cambio, el que mira se pone en ese lugar.
  #
  # Aca decia «el UNICO con una persona» y dejo de ser cierto: hay clips con
  # una mano apoyada, con alguien de paso al fondo y con una multitud cruzando,
  # todos chicos y ninguno protagonista. Se saco la lista a proposito, porque
  # habia que venir a alargarla cada vez que entra un clip. La regla nunca fue
  # que no haya gente sino que no haya una cara mirando a camara.

