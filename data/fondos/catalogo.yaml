espejo-luces-noche.mp4:
  que_es: De noche desde un auto, el espejo retrovisor y las luces de la calle mojada entre las gotas del vidrio
  etiquetas: [lluvia, gotas, auto, interior, noche, ciudad, luces, reflejo, soledad, encierro]
  # Dos cosas de la forma del archivo, las dos sin consecuencias:
  #
  # 1. Son 2,98 segundos, el UNICO mas corto que el tramo de 4 que usa el
  #    reel, asi que es el unico que de verdad se repite dentro de su escena
  #    (`-stream_loop -1`). El corte se nota poco porque es un plano quieto de
  #    luces, pero es el candidato a sacar si alguna vez molesta.
  # 2. Viene en 1080x1906 y no 1080x1920: es la unica medida distinta de la
  #    carpeta. Al encajarlo se agranda un 0,73% y se le recortan 8 px de
  #    ancho. No se ve.
