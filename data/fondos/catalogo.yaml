  # Brillo medio 20 de 255 en los cuatro segundos que se usan: el segundo mas
  # oscuro de la carpeta. Fue el mas oscuro por un rato, hasta que entro
  # `cuarto-ventanal-noche` con 18 el mismo dia. El texto blanco se lee de
  # sobra; lo que hay que saber es que estos dos son el limite -el reel ademas
