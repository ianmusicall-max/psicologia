ventanilla-lluvia-otono.mp4:
  que_es: Desde adentro de un auto parado, la calle mojada, un arbol de otono y un auto estacionado
  etiquetas: [lluvia, ventana, interior, auto, otono, calle, gris, espera, encierro, quietud]
  # El marco de la ventanilla ocupa los bordes del cuadro y deja el centro
  # libre, asi que el texto cae justo en la parte limpia. Al fondo pasa
  # alguien en bicicleta, chiquito.

volante-lluvia-parabrisas.mp4:
  que_es: Al volante bajo la lluvia, los limpiaparabrisas andando y un auto rojo adelante
  etiquetas: [lluvia, interior, auto, ruta, viaje, avanzar, gris, encierro]
  # Trae pista de audio. El reel nunca usa el audio del clip.
  #
  # Se ve una mano en el volante y el logo de la marca del auto en el centro,
  # mas la pantalla de la radio encendida a la derecha. Nada de eso se lee a
  # cuatro segundos y con el brillo bajado, pero el logo esta ahi: si alguna
  # vez molesta, el recorte del reel es vertical y el volante queda abajo.

ventanal-cruce-ciudad.mp4:
  que_es: Desde un ventanal en alto, un cruce de ciudad bajo la lluvia con buses y gente
  etiquetas: [ciudad, ventana, lluvia, altura, gris, multitud, mirar, distancia, encierro]
  # El mas cargado de la carpeta: hay carteles de ciudad en otro idioma y
  # mucha gente cruzando, todo chico y lejos. Es ruido de fondo, no detalle:
  # a cuatro segundos lo que queda es «una ciudad desde arriba, con lluvia».
  # Por eso mismo no sirve para los capitulos de quietud, y si para los de
  # ansiedad, redes y soledad en medio de la gente.

avenida-noche-torres.mp4:
  que_es: Una avenida de noche vista desde arriba entre dos torres, con el transito y las ventanas encendidas
  etiquetas: [ciudad, noche, avenida, torres, luces, altura, oscuro, soledad, encierro, cotidiano]
  # Camara QUIETA: el encuadre es el mismo en el segundo 2 y en el 12. Lo que
  # se mueve son los autos, asi que no compite con el texto.
  #
  # Es de los cuatro mas oscuros de la carpeta -brillo medio 47 de 255 en los
  # primeros cuatro segundos, contra 156 del mas claro-, o sea que el texto
  # blanco se lee de sobra. Medido, no estimado.

ventanilla-nieve-azul.mp4:
  que_es: Desde adentro de un bus, gotas en el vidrio y un paisaje nevado con edificios grises al anochecer
  etiquetas: [ventana, nieve, invierno, azul, frio, interior, viaje, gotas, melancolia, distancia]
  # Son 6,5 segundos, el mas corto de la carpeta (el que le sigue tiene 8,8).
  # No importa: el reel usa los PRIMEROS cuatro segundos de cada clip y repite
  # el que sea mas corto que el tramo (`trim=duration` con `-stream_loop -1`
  # en `video.comando`). Queda anotado para que nadie lo mire dos veces.
  #
  # Hay una mano apoyada en el marco, abajo a la derecha, y nada mas: es un
  # clip de mirar por la ventanilla, no de alguien.

calle-rieles-noche.mp4:
  que_es: Una calle de ciudad mojada de noche, con rieles al costado y los faroles reflejados en el asfalto
  etiquetas: [ciudad, noche, lluvia, calle, rieles, asfalto, reflejo, oscuro, soledad, espera]
  # Camara quieta: el encuadre es el mismo en el segundo 1 y en el 3,5, y lo
  # unico que pasa es un camion.
  #
  # **El mas oscuro de la carpeta**: brillo medio 20 de 255 en los cuatro
  # segundos que se usan, por debajo de `carretera-noche-lluvia`, que tenia el
  # record con 22. Medido, no estimado. El texto blanco se lee de sobra; lo
  # que hay que saber es que es el limite -el reel ademas baja el brillo un
  # 16%, asi que de aca para abajo la imagen deja de verse-.

gato-ventana-gris.mp4:
  que_es: Un gato de espaldas sentado frente a una puerta de vidrio, mirando un patio gris con lluvia
  etiquetas: [gato, ventana, interior, gris, monocromo, mirar, espera, quietud, hogar, soledad]
  # **El UNICO en blanco y negro**, y no «desaturado»: se comprobo pixel por
  # pixel y la diferencia entre los tres canales de un mismo pixel es CERO.
  # El resto de la carpeta va de 2,6 a 41,3 de saturacion media, asi que este
  # queda afuera de ese rango. Entra igual -el reel le baja el color un 10% a
  # todo- pero al lado de `lluvia-sobre-el-agua`, que es el turquesa, el salto
  # se nota. Si un dia hay que elegir uno solo para un reel, que no se mezcle
  # con los de color fuerte.
  #
  # El unico con un animal, y de espaldas, igual que el de la persona con
  # paraguas y por el mismo motivo: nada mira a camara, asi que el que mira se
  # pone en ese lugar. Es el clip de esperar algo que no llega.

lluvia-farol-casa.mp4:
  que_es: Lluvia fuerte de noche contra un farol y una casa amarilla con una ventana encendida
  etiquetas: [lluvia, noche, farol, casa, ventana, hogar, vegetacion, oscuro, melancolia, quietud]
  # De los pocos donde la lluvia se VE caer -hilos contra la luz del farol- y
  # no es solo un vidrio mojado. Brillo medio 46: de los cuatro mas oscuros.
  # La ventana encendida al fondo es lo unico claro del cuadro y queda abajo,
  # asi que no pelea con el texto.
