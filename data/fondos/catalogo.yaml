  #
  # De los tres mas claros de la carpeta: brillo medio 148,1 de 255, pegado a
  # `ciudad-lluvia-semaforos` (148,3) y debajo de `lluvia-sobre-el-agua`
  # (156,3), que sigue siendo el tope. Sobre un fondo asi el texto blanco
