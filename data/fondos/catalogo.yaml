  # APAISADO, y el mas extremo de la carpeta: viene en 3364x1440 (2,34:1), asi
  # que al encajarlo en el reel se agranda 1,33 y **queda el 24% del ancho**.
  # Entra bien igual porque el auto esta en el centro y las hojas de arriba
  # siguen enmarcando; lo que se pierde son los costados, que son mas de lo
  # mismo. Se comprobo dibujando el recorte, no razonando.
  apaisado: true
  #
