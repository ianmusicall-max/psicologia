# Que hay en cada clip, para poder elegir el que acompaña al tema del reel.
#
# Las etiquetas describen lo que SE VE y lo que se siente, no el tema del
# banco: un mismo clip sirve para varios capitulos, y atarlo a uno solo
# desperdicia la mitad del archivo.
#
# Un clip que no este listado se puede usar igual, solo que sin etiquetas: va
# al monton del que se elige cuando ninguno coincide. Asi se pueden subir
# clips nuevos sin tener que tocar este archivo el mismo dia.
#
# Para agregar uno: el nombre del archivo y sus etiquetas. El nombre es
# descriptivo a proposito -`lluvia-arbol-gris` y no `7681527`- porque es lo
# primero que se lee al mirar la carpeta y al leer el log de una corrida.
#
# EL LARGO DE LOS CLIPS, la regla que puso el usuario el 2026-10-26:
#
#     mas de 6 segundos  ->  se recorta a 6, sin recomprimir
#     6 o menos          ->  NO SE TOCA, entra tal cual
#
# El reel usa los PRIMEROS CUATRO segundos de cada uno, y siempre los mismos
# aunque un clip salga dos veces en el mismo reel: cada tramo es una entrada
# propia con `trim=duration` y SIN `-ss` (`video.comando`). O sea que de ahi
# en adelante no se ve nada nunca, y el margen es para el dia que
# `video.ESCENA` suba de 4.
#
# El recorte es SIN RECOMPRIMIR (`-c copy`, en `achicar_fondos.recortar`): los
# cuatro segundos que se usan salen bit por bit iguales a los del original. Un
# clip que ya entra en el tope ni se abre. Hay pruebas para las dos mitades.
#
# Ese dia se recortaron los 54 que habia y la carpeta paso de 584 MB a
# 263 MB. El mas largo mide 6,13: `-c copy` corta por paquete y no por cuadro,
# asi que el archivo termina unos milisegundos despues del segundo 6.

