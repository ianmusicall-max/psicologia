  etiquetas: [lluvia, gotas, ventana, verde, gris, oscuro, interior, quietud, encierro]
  # APAISADO (1920x1080): queda el 32% del ancho. Aca no importa nada, y es
  # el caso en que un clip horizontal entra sin pagar peaje: es una TEXTURA,
  # no una composicion. No hay horizonte ni sujeto que pueda quedar afuera, y
  # por lo mismo el texto se lee sobre cualquier parte del cuadro.
  apaisado: true
  #
  # Se parece a `gotas-arbol-verde` y no son lo mismo: aquel tiene cielo
  # blanco y un arbol reconocible, y es de los mas claros (brillo 113). Este
  # no tiene cielo, las gotas son mas grandes y esta bastante mas oscuro (88).
  #
  # **El que mas gano con el recorte del 2026-10-26**: era el mas largo de la
  # carpeta -44 s contra 25 del que le seguia- y pesaba 29,05 MB, de los que
  # el reel usaba 4 s. Quedo en 6,13 s y 4,60 MB: 24 MB menos el, solo.
  # Hoy comparte el puesto de mas largo con `torre-antena-niebla`, los dos en
  # 6,131125 s exactos.

