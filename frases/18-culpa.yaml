# Capítulo 18 · Culpa y vergüenza no son lo mismo
tema: culpa
capitulo: 18
eje: nucleo
titulo: Culpa y vergüenza no son lo mismo
hashtags: [culpa, verguenza, perdon]
tesis: >-
  La culpa dice hice algo mal y empuja a repararlo. La vergüenza dice soy algo
  malo y empuja a esconderse. Se parecen por dentro y hacen lo contrario por
  fuera: una mejora los vínculos y la otra los rompe. Distinguirlas es de las
  cosas más útiles que la psicología tiene para ofrecer.

frases:
  - id: cul-01
    texto: "La culpa dice hice algo mal. La vergüenza dice soy algo malo. Se parecen por dentro y hacen lo contrario por fuera."
    destacar: [soy algo malo]
    principio: "La culpa se dirige a la conducta y motiva reparación; la vergüenza se dirige al yo y motiva ocultamiento y evitación."
    fuente: "Tangney & Dearing (2002), Shame and Guilt; Tangney, Stuewig & Mashek (2007), Annual Review."
    reflexion: >-
      Es la distinción más útil de toda esta área y casi nadie la conoce.
      Quien siente culpa llama, pide disculpas, arregla. Quien siente
      vergüenza desaparece, se pone a la defensiva o ataca primero. El mismo
      error puede producir cualquiera de las dos, y el resultado no se parece
      en nada.

  - id: cul-02
    texto: "Esconderte no es cobardía. Es exactamente lo que la vergüenza está diseñada para hacerte hacer."
    destacar: [esconderte]
    principio: "La vergüenza organiza una respuesta de ocultamiento y retirada social; no es un déficit de carácter sino la función de la emoción."
    fuente: "Tangney et al. (2007); Gilbert (2009), terapia centrada en la compasión."
    reflexion: >-
      La vergüenza empuja a achicarse, bajar la mirada y desaparecer de la
      escena. Entenderlo cambia la pregunta: en vez de por qué soy así,
      aparece qué estoy tratando de que nadie vea. Y eso sí se puede
      contestar.

  - id: cul-03
    texto: "Una disculpa funciona cuando incluye lo que hiciste, no cuando incluye lo que sentís."
    destacar: [lo que hiciste]
    principio: "De los componentes de una disculpa, reconocer la responsabilidad es el que más pesa; la expresión de arrepentimiento sola pesa mucho menos."
    fuente: "Lewicki, Polin & Lount (2016), Negotiation and Conflict Management Research: los componentes de una disculpa eficaz."
    reflexion: >-
      Se midieron los pedazos de una disculpa por separado. El que más mueve
      la aguja es decir qué hiciste y hacerte cargo. «Perdón si te sentiste
      mal» no incluye eso, y por eso suena a lo que es: una forma de pedir
      disculpas sin reconocer nada.

  - id: cul-04
    texto: "Sentirte mal mucho tiempo no repara nada. Lo que repara es lo que hacés el día siguiente."
    destacar: [el día siguiente]
    principio: "La rumiación sobre una falta no produce reparación y se asocia a vergüenza; la acción reparadora concreta sí resuelve la culpa."
    fuente: "Baumeister, Stillwell & Heatherton (1994), Psychological Bulletin: las funciones interpersonales de la culpa."
    reflexion: >-
      Hay una idea de que el castigo interno paga la deuda, y por eso mucha
      gente se queda en el malestar como si eso fuera la reparación. No lo es
      para el otro, que no ve nada, y tampoco para uno. La culpa termina
      cuando algo cambió afuera, no cuando el malestar fue suficiente.

  - id: cul-05
    texto: "La culpa que no lleva a ninguna acción no es responsabilidad. Es un impuesto que te cobrás."
    destacar: [un impuesto]
    principio: "La culpa adaptativa es específica y accionable; la culpa crónica y difusa no corrige nada y se asocia a malestar."
    fuente: "Tilghman-Osborne, Cole & Felton (2010), revisión sobre culpa adaptativa y desadaptativa."
    reflexion: >-
      Preguntale a la culpa qué querés que haga. Si tiene respuesta, es
      información y conviene hacerle caso. Si no tiene, no está pidiendo nada:
      está cobrando. Esa diferencia se puede chequear en treinta segundos y
      ahorra meses.

  - id: cul-06
    texto: "Sentirte culpable por descansar es la prueba de que creés que valés por lo que producís."
    destacar: [por lo que producís]
    principio: "La valía contingente al logro convierte el descanso en una transgresión, y mantiene el ciclo de agotamiento."
    fuente: "Crocker & Wolfe (2001), Psychological Review, contingencias de la autoestima; Sonnentag & Fritz (2007)."
    reflexion: >-
      Si el valor propio depende de lo hecho, cada hora sin hacer nada se
      siente como una pérdida de valor. Por eso hay gente que descansa peor
      que la que trabaja, y vuelve del descanso más cansada. El problema no
      es la agenda: es de dónde cree esa persona que viene su valor.

  - id: cul-07
    texto: "Que alguien se enoje con vos no te hace culpable. Son dos cosas distintas y casi siempre se confunden."
    destacar: [dos cosas distintas]
    principio: "La reacción emocional ajena no establece responsabilidad; confundirlas es un patrón central en personas con tendencia a la complacencia."
    fuente: "Alberti & Emmons (2017), asertividad; Tangney & Dearing (2002)."
    reflexion: >-
      Hay personas que, apenas alguien se molesta, revisan qué hicieron mal,
      incluso cuando no hicieron nada. Aprendieron a usar el estado de ánimo
      del otro como el termómetro de su propia conducta. Son dos preguntas
      distintas: qué siente el otro, y si está bien lo que hice.

  - id: cul-08
    texto: "Perdonarte no es decirte que da igual. Es dejar de cobrarte después de haber pagado."
    destacar: [dejar de cobrarte]
    principio: "El autoperdón adaptativo requiere reconocer la falta y reparar; sin eso es autoindulgencia, y sin fin es autocastigo."
    fuente: "Hall & Fincham (2005), modelo del autoperdón; Neff (2003), autocompasión."
    reflexion: >-
      El autoperdón tiene mala prensa porque se confunde con hacerse el
      distraído. No es eso. Supone haber mirado qué pasó, haberse hecho cargo
      y haber hecho lo que se podía. Lo que viene después, seguir cobrándose
      indefinidamente, ya no mejora nada ni para uno ni para el otro.
