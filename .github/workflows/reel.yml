# Arma un reel y te lo manda al chat de Telegram.
#
# No tiene horario: se lanza a mano desde la pestania Actions. Un reel es una
# decision -elegis el capitulo, lo mirás, y lo subis vos-, no algo que tenga
# que salir solo como los posts.
#
# Esto existe porque la voz de IA se pide a OpenAI, y OpenAI no se alcanza
# desde donde se escribe el codigo. Aca si, asi que el reel se arma en los
# servidores de GitHub y llega al telefono sin pasar por la Mac.
#
# Secretos que usa (Settings -> Secrets and variables -> Actions):
#   OPENAI_API_KEY    para la voz. Sin el, el reel sale mudo igual.
#   TELEGRAM_TOKEN    para mandarlo al chat
#   TELEGRAM_CHAT_ID  a que chat
#   ELEVENLABS_API_KEY  la voz de ElevenLabs. Sin ella, `voz_eleven` falla y
#                     el resto sigue andando con la de OpenAI.
#   PEXELS_API_KEY    para bajar el metraje de fondo. Es gratuita y se saca en
#                     https://www.pexels.com/api/ con un correo. SIN ELLA el
#                     reel sale con el papel de la marca de fondo, que es
#                     exactamente lo que pasaba antes.
# Sin los de Telegram el reel queda igual, para bajar desde la corrida.
#
# Los clips se bajan ACA y no donde se escribe el codigo porque desde alla
# Pexels no se alcanza. Es la misma razon por la que la voz se pide aca.
name: Reel

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Capitulo (nombre o numero). Vacio: la frase que toca, unos 30 s"
        required: false
        default: "autoestima"
      voz:
        description: "Voz de OpenAI: onyx, ash, sage, ballad. Vacio: sin voz"
        required: false
        default: "onyx"
      voz_eleven:
        description: "Id de voz de ElevenLabs. Si se pone, se usa esta y no la de OpenAI"
        required: false
        default: ""
      listar_eleven:
        description: "Solo decir que voces de ElevenLabs tiene la cuenta y mandar muestras"
        type: boolean
        default: false
      musica:
        description: "Musica de fondo"
        type: boolean
        default: true
      ingles:
        description: "Voz en INGLES y subtitulos en espanol"
        type: boolean
        default: true
      guardar:
        description: "Dejar el mp4 en data/reels/ultimo.mp4 del repositorio"
        type: boolean
        default: false
      probar_voces:
        description: "Solo mandar muestras de voz al chat para elegir (no arma reel)"
        type: boolean
        default: false
      colores:
        description: "Con probar_voces: procesados de UNA voz (ej: nada,calida,cine,honda)"
        required: false
        default: ""
      color:
        description: "Como suena la voz del reel: nada, calida, cine, honda"
        required: false
        default: ""

permissions:
  # Escritura porque con `guardar` el reel se deja commiteado en el repo.
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      TZ: America/Lima
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # El de video, que trae su propio ffmpeg. Es el unico lugar donde hace
      # falta: el turno que publica cada hora no arma videos.
      - run: pip install -r requirements-video.txt

      # La voz es lo unico que se paga, y la maquina es nueva cada vez: sin
      # esto, rehacer un reel -o cambiarle el fondo, o la musica- vuelve a
      # pagar los mismos renglones.
      #
      # Va separado en recuperar y guardar, y no con `actions/cache` de una
      # pieza, por una razon que costo dinero: esa version guarda SOLO si el
      # trabajo termina bien, y los dos primeros intentos fallaron DESPUES de
      # haber pedido las 28 voces. Las pago las dos veces y no guardo ninguna.
      # Con `if: always()` lo que ya se pago queda guardado aunque el reel
      # despues no se arme.
      - name: Recuperar las voces ya pagadas
        id: voces
        uses: actions/cache/restore@v4
        with:
          path: data/voz_cache
          key: voz-${{ github.run_id }}
          restore-keys: voz-

      # El metraje pesa y no cambia, asi que se baja una vez y se reusa. La
      # llave no lleva el numero de corrida: lo que se quiere es el MISMO
      # metraje en todos los reels, no uno nuevo cada vez.
      - name: Recuperar el metraje de fondo
        uses: actions/cache/restore@v4
        with:
          path: data/fondos
          key: fondos-v1

      - name: Bajar el metraje que falte
        if: ${{ !inputs.probar_voces && !inputs.listar_eleven }}
        run: |
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "Sin PEXELS_API_KEY: el reel va a salir con el papel de la"
            echo "marca de fondo. Se saca gratis en pexels.com/api y se carga"
            echo "como secreto del repositorio."
          else
            python scripts/fondos.py
          fi

      - name: Guardar el metraje
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/fondos
          key: fondos-v1
        continue-on-error: true

      - name: Probar voces de ElevenLabs
        if: ${{ inputs.listar_eleven }}
        run: python scripts/probar_voces.py --eleven

      - name: Probar voces
        if: ${{ inputs.probar_voces }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.colores }}" ]; then
            ARGS="--colores ${{ inputs.colores }}"
          fi
          if [ -n "${{ inputs.voz }}" ]; then
            ARGS="$ARGS --voces ${{ inputs.voz }}"
          fi
          python scripts/probar_voces.py $ARGS

      - name: Armar el reel
        if: ${{ !inputs.probar_voces && !inputs.listar_eleven }}
        run: |
          ARGS="--carpeta data/reels"
          if [ -n "${{ inputs.tema }}" ]; then
            ARGS="$ARGS --tema ${{ inputs.tema }}"
          fi
          if [ -n "${{ inputs.voz_eleven }}" ]; then
            ARGS="$ARGS --voz-eleven ${{ inputs.voz_eleven }}"
          elif [ -n "${{ inputs.voz }}" ]; then
            ARGS="$ARGS --voz-ia ${{ inputs.voz }}"
          fi
          if [ "${{ inputs.musica }}" = "true" ]; then
            ARGS="$ARGS --musica"
          fi
          if [ -n "${{ inputs.color }}" ]; then
            ARGS="$ARGS --color ${{ inputs.color }}"
          fi
          if [ "${{ inputs.ingles }}" = "true" ]; then
            ARGS="$ARGS --ingles"
          fi
          # Los clips solo se usan si de verdad hay VIDEOS: sin ellos el
          # fondo es el papel de la marca, que no depende de nada.
          #
          # Se cuentan los videos y no los archivos. Con `ls -A` alcanzaba un
          # LEEME.md o un .DS_Store para que la carpeta pareciera llena, y
          # entonces `reel.py` aborta con "no hay ningun video": el reel se
          # perderia por un archivo de texto.
          if [ -n "$(find data/fondos -maxdepth 1 -type f \
                      \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.m4v' \
                         -o -iname '*.webm' -o -iname '*.mkv' \) 2>/dev/null)" ]; then
            ARGS="$ARGS --fondo data/fondos"
          fi
          echo "scripts/reel.py $ARGS"
          python scripts/reel.py $ARGS --telegram

      # Aunque el reel no se haya armado: lo que se le pago a OpenAI ya esta
      # pagado y tiene que sobrevivir al fallo.
      - name: Guardar las voces
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/voz_cache
          key: voz-${{ github.run_id }}

      # Deja el mp4 EN el repositorio. Hace falta porque el servidor de
      # artefactos de GitHub no se alcanza desde donde se escribe el codigo:
      # el reel se armaba bien y no habia forma de mirarlo desde aca.
      #
      # Siempre el MISMO nombre, que se pisa a si mismo: un mp4 por cada reel
      # armado dejaria el repositorio inmanejable en una semana.
      - name: Dejar el reel en el repositorio
        if: ${{ inputs.guardar && !inputs.probar_voces && !inputs.listar_eleven }}
        run: |
          ULTIMO=$(ls -t data/reels/*.mp4 2>/dev/null | head -1)
          if [ -z "$ULTIMO" ]; then
            echo "No hay ningun mp4 que guardar."
            exit 0
          fi
          mkdir -p data/reels
          cp "$ULTIMO" data/reels/ultimo.mp4
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/reels/ultimo.mp4
          git commit -m "Reel armado: $(basename "$ULTIMO")" || exit 0
          # Otro turno pudo haber subido el estado mientras esto corria.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

      # Queda para bajar aunque Telegram falle o el video pase de 50 MB, que
      # es el tope de un bot. Sin esto, un reel que no se pudo mandar se
      # perderia con la maquina.
      - name: Dejarlo para bajar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: data/reels/*.mp4
          if-no-files-found: ignore
          retention-days: 7
