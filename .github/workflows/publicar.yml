# Publica la frase que toca, cada hora, desde los servidores de GitHub.
#
# Esto reemplaza al cron de la Mac: no depende de que la laptop este
# encendida. PUBLICA SIN APROBACION, que es lo que se pidio.
#
# Hacen falta dos secretos en el repositorio
# (Settings -> Secrets and variables -> Actions):
#   PSI_FB_PAGE_ID     el id de la pagina
#   PSI_FB_PAGE_TOKEN  el token permanente de pagina
name: Publicar

on:
  schedule:
    # CUATRO veces por hora y NINGUNA en punto, y las dos cosas son por lo
    # mismo: el 2026-10-23 el turno de las 16 de Lima no salio solo y hubo que
    # dispararlo a mano. GitHub no garantiza los horarios -los demora o los
    # saltea cuando hay carga- y la carga es maxima en el minuto 0, que es
    # cuando todo el mundo programa sus tareas.
    #
    # Cuatro intentos hacen falta porque la ventana de un turno es UNA hora:
    # el script publica la hora en la que esta corriendo, asi que una corrida
    # de las 16 que llegue a las 17 ya no sirve. Con cuatro, que se caigan
    # todas es mucho mas raro que se caiga una.
    #
    # Correrlo de mas no cuesta nada: fuera de las horas de la parrilla sale
    # sin tocar nada, y dentro, `ya_salio_en_esta_hora` hace que el segundo
    # intento no publique un segundo post. `concurrency` los pone en fila para
    # que no se pisen al subir el estado.
    - cron: "7,22,37,52 * * * *"
  # Para probarlo a mano desde la pestania Actions sin esperar a la hora.
  workflow_dispatch:

permissions:
  # Para poder volver a subir data/publicadas.json. Sin esto, cada corrida
  # empezaria de cero y republicaria la primera frase.
  contents: write

concurrency:
  # Dos corridas a la vez se pisarian al subir el estado. Y no se cancela la
  # que ya esta andando: podria estar justo publicando.
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      # Las horas de la parrilla son horas de Lima. El runner viene en UTC, y
      # sin esto publicaria con cinco horas de corrimiento.
      TZ: America/Lima
      PSI_FB_PAGE_ID: ${{ secrets.PSI_FB_PAGE_ID }}
      PSI_FB_PAGE_TOKEN: ${{ secrets.PSI_FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar si a esta hora le toca
        run: python scripts/publicar_turno.py

      - name: Guardar lo que salio
        run: |
          git config user.name "Turno automatico"
          git config user.email "noreply@users.noreply.github.com"
          # Puede no existir todavia: fuera de hora el script no publica nada,
          # y `git add` de un archivo que no esta corta el paso con error.
          if [ ! -f data/publicadas.json ]; then
            echo "Todavia no salio ningun post."
            exit 0
          fi
          git add -f data/publicadas.json
          # Si no salio nada -fuera de hora, o ya habia salido- no hay que
          # commitear: un commit vacio por hora ensuciaria la historia.
          if git diff --staged --quiet; then
            echo "Nada que guardar."
            exit 0
          fi
          git commit -m "Publicado: $(date +'%Y-%m-%d %H:00')"
          # El turno de la hora siguiente puede haber subido algo mientras
          # tanto; se rebasea antes de empujar en vez de fallar.
          git pull --rebase --autostash
          git push
