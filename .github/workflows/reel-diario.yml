# Un reel por dia, a las 18:00 de Lima, en Facebook, Instagram y YouTube.
#
# Lo pidio el usuario el 2026-10-24. **El reel NO se publica solo**: se arma,
# llega al chat de Telegram con dos botones y sale recien cuando se aprueba
# -pedido del mismo dia, unas horas despues-. Las frases siguen saliendo por
# su turno sin aprobacion, que es otra decision y no se toco.
#
# El turno espera la respuesta hasta dos horas (`diario.ESPERA_APROBACION`) y
# eso no cuesta nada: el repositorio es publico, asi que los minutos de
# Actions son libres. Si no se contesta, el reel queda armado y guardado, y
# publicarlo despues no vuelve a pagar la voz.
#
# El mismo camino lo corre el boton del bot. Si cada uno hiciera lo suyo, el
# dia que esto cambie se arregla uno y el otro se queda con la forma vieja.
#
# A mano sirve tambien para publicar un reel que YA esta armado (`video`) y,
# si ese video ya esta en YouTube, para saltear esa plataforma
# (`sin_youtube`). El texto NO se inventa: sale de la ficha que quedo al lado
# del mp4, que dice de que frase es.
name: Reel del dia

on:
  schedule:
    # 23:07 y 23:37 UTC son las 18:07 y 18:37 de Lima. NINGUNA en punto y DOS
    # intentos, por lo mismo que el turno de las frases: GitHub demora o
    # saltea los horarios, y la carga es maxima en el minuto 0.
    #
    # El segundo intento no cuesta nada: `reel_del_dia.py` mira si hoy ya
    # salio uno y se va sin armar nada. Sin esa guarda serian DOS reels por
    # dia y la voz pagada dos veces.
    - cron: "7,37 23 * * *"
  workflow_dispatch:
    inputs:
      tema:
        description: "Capitulo entero (nombre o numero). Vacio: la frase que toca"
        required: false
        type: string
      # Elegir la frase es, en la practica, elegir cuanto dura el reel: el
      # guion sale de lo que el banco tiene escrito alrededor de ella, y las
      # 243 dan entre 63 y 84 segundos reales. Pedir una del capitulo que
      # igual tocaba no rompe la rotacion, que es por capitulo y no por
      # frase.
      frase:
        description: "Que frase (ej: ans-07). Vacio: la que toca. Es como se elige el largo"
        required: false
        type: string
      otra_vez:
        description: "Armar otro aunque hoy ya haya salido"
        required: false
        type: boolean
        default: false
      solo_probar:
        description: "Solo comprobar las credenciales: no arma ni publica nada"
        required: false
        type: boolean
        default: false
      video:
        description: "Publicar un mp4 que YA esta armado (ej: data/reels/ultimo.mp4). Vacio: armar uno"
        required: false
        type: string
      sin_youtube:
        description: "No subir a YouTube. Para un video que ya esta alla"
        required: false
        type: boolean
        default: false
      # Una por plataforma, para poder reponer la que fallo sin repetir las
      # que ya salieron. Sin esto, reintentar Instagram publicaba un segundo
      # reel en Facebook.
      sin_facebook:
        description: "No publicar en Facebook. Para reponer solo las otras"
        required: false
        type: boolean
        default: false
      sin_instagram:
        description: "No publicar en Instagram"
        required: false
        type: boolean
        default: false
      sin_aprobar:
        description: "Publicar sin pedir permiso por Telegram"
        required: false
        type: boolean
        default: false

permissions:
  # Para volver a subir data/reels_publicados.json. Sin esto, el segundo
  # intento no se entera de que el primero ya publico.
  contents: write

concurrency:
  group: reel-del-dia
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    env:
      TZ: America/Lima
      # Para dejar el mp4 del dia en su propia rama, que es de donde Instagram
      # se lo baja. Alcanza el token del propio turno: `contents: write` esta
      # declarado arriba y la rama es de este mismo repositorio.
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PSI_FB_PAGE_ID: ${{ secrets.PSI_FB_PAGE_ID }}
      PSI_FB_PAGE_TOKEN: ${{ secrets.PSI_FB_PAGE_TOKEN }}
      # Los tres de YouTube. Si faltan, el reel sale igual en Facebook y en
      # Instagram y el aviso dice que YouTube no pudo: una plataforma sin
      # credencial no puede llevarse a las otras dos.
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      # CON los clips de fondo, al reves que el turno de las frases: este si
      # los usa, y es una vez por dia.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-video.txt

      # La voz es lo unico que se paga por renglon. Separado en recuperar y
      # guardar con `if: always()`: con `actions/cache` de una pieza, un fallo
      # despues de pedir las voces las paga y no las guarda.
      - name: Recuperar las voces ya pagadas
        uses: actions/cache/restore@v4
        with:
          path: data/voz_cache
          key: voz-${{ github.run_id }}
          restore-keys: voz-

      # Espera tu respuesta: el tope del paso tiene que ser mayor que
      # `diario.ESPERA_APROBACION` (dos horas) o el turno moriria esperando.
      - name: Armar el reel, mandarlo a aprobar y publicarlo
        timeout-minutes: 180
        env:
          # Lo que se escribe en el formulario viaja por env y NO interpolado
          # dentro del script: un valor con un `;` o con comillas se correria
          # como comando. Y de paso un nombre con espacios llega entero.
          TEMA: ${{ inputs.tema }}
          FRASE: ${{ inputs.frase }}
          VIDEO: ${{ inputs.video }}
        run: |
          ARGS=()
          if [ -n "$TEMA" ]; then ARGS+=(--tema "$TEMA"); fi
          if [ -n "$FRASE" ]; then ARGS+=(--frase "$FRASE"); fi
          if [ -n "$VIDEO" ]; then ARGS+=(--video "$VIDEO"); fi
          if [ "${{ inputs.otra_vez }}" = "true" ]; then ARGS+=(--otra-vez); fi
          if [ "${{ inputs.sin_youtube }}" = "true" ]; then ARGS+=(--sin-youtube); fi
          if [ "${{ inputs.sin_facebook }}" = "true" ]; then ARGS+=(--sin-facebook); fi
          if [ "${{ inputs.sin_instagram }}" = "true" ]; then ARGS+=(--sin-instagram); fi
          if [ "${{ inputs.sin_aprobar }}" = "true" ]; then ARGS+=(--sin-aprobar); fi
          if [ "${{ inputs.solo_probar }}" = "true" ]; then ARGS+=(--probar); fi
          python scripts/reel_del_dia.py "${ARGS[@]}"

      - name: Guardar las voces
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/voz_cache
          key: voz-${{ github.run_id }}

      # Lo que hace que el segundo intento no arme otro reel.
      - name: Guardar lo que salio
        if: always()
        run: |
          git config user.name "Turno automatico"
          git config user.email "noreply@users.noreply.github.com"
          if [ ! -f data/reels_publicados.json ]; then
            echo "Todavia no salio ningun reel."
            exit 0
          fi
          git add -f data/reels_publicados.json
          if git diff --staged --quiet; then
            echo "Nada que guardar."
            exit 0
          fi
          git commit -m "Reel del dia: $(date +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
