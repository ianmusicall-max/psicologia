# La página de frases. Una sola por ahora; si algún día hay réplicas, cada una
# es otra entrada con su propio nombre, paleta y credenciales.
pagina:
  # Cómo se firma el flyer arriba a la izquierda y en el pie. Cambiar cuando
  # la página tenga nombre definitivo: el dibujo lo lee de aquí.
  nombre: JOSDELCARPIO
  # Pie del flyer. Vacío usa el nombre.
  firma: ""

  # El reparto del flyer. Hay cuatro y se cambian con esta línea sola:
  #   regla     una raya de acento y el texto a la izquierda
  #   marco     como la página de un libro: un filete alrededor, centrado
  #   ficha     papel rayado limpio, con el margen del cuaderno
  #   marcador  la palabra marcada con resaltador en vez de en color
  # `scripts/probar_estilos.py` los dibuja todos con la misma frase.
  estilo: regla

  # Publicar tambien en Instagram. El flyer no se sube dos veces: Instagram
  # baja la imagen que Facebook acaba de publicar, asi que no hace falta
  # ningun servidor. Necesita una cuenta profesional vinculada a la pagina y
  # el token con instagram_basic e instagram_content_publish:
  # `scripts/revisar_instagram.py` dice si esta todo.
  instagram: true

  # En cuales de las horas de la parrilla. Vacio serian las ocho, que es como
  # estuvo hasta el 2026-10-24.
  #
  # UNA, y la eligio el usuario el mismo dia despues de mirar sus numeros: en
  # su grilla el reel marca 113 vistas y los flyers 2. En Instagram la foto
  # estatica casi no viaja -el alcance lo reparte por reels- asi que la frase
  # escrita no esta ahi por alcance: esta porque es la que hace que el perfil
  # se lea como un libro. El que llega por el reel entra, ve los capitulos y
  # entiende de que va la cuenta.
  #
  # Por eso una y no cero: con la grilla llena de videos, la promesa de la
  # biografia no se prueba en ningun lado.
  #
  # Las 12, que es el mediodia y queda lejos de las 18 -la hora del reel-.
  # Dos cosas de la pagina pegadas compiten entre ellas.
  #
  # En Facebook siguen saliendo las ocho, que ahi si monetizan y el feed
  # todavia muestra fotos.
  instagram_horas: [12]

  # La parrilla completa. De aca se eligen las horas de cada dia, repartidas
  # parejo: con cuatro posts no salen las primeras cuatro -toda la manana y
  # la tarde vacia- sino cuatro a lo largo del dia.
  horas: [8, 10, 12, 14, 16, 18, 20, 22]

  # La rampa. Se cuenta desde el primer dia que se publico, no desde una
  # fecha escrita aca: empieza sola y no hay que acordarse de nada.
  arranque:
    - {dias: 3, posts: 4}
    - {dias: 4, posts: 5}
    - {dias: 5, posts: 6}
  # Y de ahi en adelante:
  posts_por_dia: 8

  # Mientras dure la prueba, cada post del dia sale con un estilo distinto, y
  # el reparto se corre un lugar cada dia para que cada estilo pase por todas
  # las horas. Apagarlo vuelve a usar `estilo` siempre.
  rotar_estilos: true

  # Paleta propia. Es una página de psicología, no de salud: papel cálido,
  # tinta azul noche y un solo acento terracota para la palabra destacada.
  paleta:
    fondo: "#F3EFE6"
    tinta: "#1F2933"
    acento: "#B5654A"
    suave: "#8C8F93"

  # Cinco hashtags por post: estos dos fijos y los tres del tema. Mismo
  # criterio que las páginas de salud.
  hashtags_fijos: [psicología, relaciones]

  # VACÍO, y lo pidió el usuario dos veces: «no menciones lo de terapia nunca
  # más». La segunda vez fue el 2026-10-27, viendo el caption del reel de
  # ruptura, que es uno de los tres temas marcados `sensible: true` (los otros
  # son duelo e intimidad) y por eso lo seguía llevando.
  #
  # Mientras esté vacío no sale en ningún caption: los tres lugares que lo
  # agregan (`frases.caption`, `caption_de_tema` y `caption_de_reel`) piden
  # que haya algo escrito acá. O sea que esto NO se arregla volviendo a
  # llenarlo, que es justo lo que no hay que hacer.
  #
  # La guarda de verdad es una prueba que recorre el repositorio y se pone en
  # rojo si el texto vuelve a aparecer en cualquier lado.
  pie_sensible: ""

  facebook:
    page_id_env: PSI_FB_PAGE_ID
    token_env: PSI_FB_PAGE_TOKEN
