- id: mundo-02
  lugar: "Noruega"
  texto: "En Noruega, el derecho a recorrer la naturaleza está protegido por ley."
  destacar: [protegido por ley]
  detalle: "El allemannsretten permite caminar por terrenos abiertos, aunque tengan dueño. También permite acampar bajo ciertas condiciones. Por regla general, la carpa debe quedar al menos a 150 metros de una casa o cabaña habitada. La foto muestra Reine, en las islas Lofoten."
  fuente: https://www.environmentagency.no/areas-of-activity/right-to-roam/camping/
  foto: ../assets/curiosidades/noruega.jpg
  credito: Petr Kraumann
  foto_fuente: https://commons.wikimedia.org/wiki/File:Reine,_Lofoten_-_panoramio.jpg
  licencia: "CC BY 3.0 · https://creativecommons.org/licenses/by/3.0/"

- id: mundo-03
  lugar: "Lago Titicaca, Perú"
  texto: "En el Titicaca hay familias que viven en islas flotantes hechas de totora."
  destacar: [islas flotantes]
  detalle: "Las familias uro-aimaras usan esta planta acuática para construir las islas y también para hacer viviendas y embarcaciones."
  fuente: https://www.peru.travel/attractions/uros-islands
  foto: ../assets/curiosidades/uros.jpg
