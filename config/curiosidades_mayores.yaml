# El turno toma la primera curiosidad que no figure en el registro.
- id: mundo-01
  lugar: "Valparaíso, Chile"
  texto: "En Valparaíso, hay ascensores que suben a los cerros sobre rieles."
  destacar: [sobre rieles]
  detalle: "En una ciudad de calles empinadas, estos funiculares conectaron la parte baja con los barrios de los cerros. La foto muestra el ascensor Artillería en 2007."
