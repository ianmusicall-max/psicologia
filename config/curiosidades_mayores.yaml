  foto_fuente: https://commons.wikimedia.org/wiki/File:The_Great_Mosque,_Djenne.jpg
  licencia: "CC BY 2.0 · https://creativecommons.org/licenses/by/2.0/"

- id: mundo-05
  lugar: "Shirakawa-gō, Japón"
  texto: "Bajo los techos de paja de Shirakawa-gō se criaban gusanos de seda."
  destacar: [gusanos de seda]
  detalle: "Las casas tradicionales de estilo gasshō tienen techos muy inclinados. En aldeas como Ōgimachi, la cría de gusanos de seda y el cultivo de moreras formaron parte de la economía local."
