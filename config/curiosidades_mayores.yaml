- id: mundo-04
  lugar: "Djenné, Malí"
  texto: "En Djenné, renovar el barro de la Gran Mezquita es una tradición anual."
  destacar: [tradición anual]
  detalle: "La comunidad se reúne para renovar la capa de barro que protege los muros de esta mezquita de tierra. El trabajo forma parte del calendario de celebraciones de la ciudad."
  fuente: https://whc.unesco.org/en/urban-heritage-atlas/djenne/
