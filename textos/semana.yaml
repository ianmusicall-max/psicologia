# Siete textos para la semana, uno por día, en PRIMERA PERSONA.
#
# Los pidió el usuario el 2026-10-26: textos de 90 segundos sacados del libro,
# hablados como «yo» y no como «tú».
#
# POR QUÉ NO VAN EN `frases/`. Una frase del banco es una línea citable más su
# reflexión, y la usan tres cosas: el flyer, el capítulo del libro y el reel.
# Estos son un monólogo de una pieza -no se citan, no se parten, no entran en
# un flyer- y además cambian de persona. Metidos ahí habrían roto a los tres,
# y `frases.leer()` lee TODOS los yaml de esa carpeta.
#
# CADA UNO SALE DE UN CAPÍTULO ESCRITO (`libro/capitulos/`) y lo dice el campo
# `capitulo`. Eso es lo que mantiene la página y el libro diciendo lo mismo:
# quien llega por un reel encuentra adentro, desarrollado, lo que escuchó.
#
# EL LARGO NO SE ELIGE A OJO, Y EL SILENCIO CUENTA. Son unos 880 caracteres,
# que `video.segundos_reales` predice entre 83,8 y 84,7 segundos CONTANDO las
# pausas largas: debajo de `video.TOPE_CON_MARGEN` (85,5) y de los 90 que
# admiten Facebook e Instagram. Hay una prueba que lo exige, así que un texto
# que se pase se pone en rojo acá y no después de pagar la voz.
#
# EL ÚLTIMO PÁRRAFO ES EL MENSAJE FINAL, y es lo único que habla de «tú». El
# usuario lo pidió el 2026-10-26: «acaba muy seco sin ningún mensaje». Los
# siete contaban mi historia y se cortaban. Ahora el cuerpo sigue siendo lo
# que me pasó a mí y el cierre se da vuelta y le deja algo a quien mira. Hay
# dos pruebas: una exige primera persona en el cuerpo y la otra, que el
# último párrafo se dirija a quien mira.
#
# Cuesta unos diez segundos, así que los siete se recortaron el mismo día para
# que entraran. Si se alarga un cierre, hay que acortar el cuerpo.
#
# LOS PÁRRAFOS SON LOS ESPACIOS. Donde hay un renglón en blanco, el reel se
# calla `video.PAUSA_PARRAFO` en vez de `video.PAUSA`. Lo pidió el usuario el
# 2026-10-26 -«dejando espacios»- y no es decoración: es lo que hace que un
# monólogo de 33 renglones no suene a dictado. Cuesta casi cinco segundos por
# texto, y por eso los siete se recortaron ese mismo día. Mover un renglón en
# blanco cambia cuánto dura el reel.
#
# QUEDA AFUERA `pensamientos` (capítulo 8), a propósito: su material -dar
# vueltas, pensar no es lo mismo que rumiar- es el mismo que el del martes, y
# dos días de la misma semana diciendo lo mismo se nota.

- id: sem-01
  dia: lunes
  capitulo: emociones
  titulo: La emoción no duraba seis horas
  texto: >-
    Durante años creí que mis emociones duraban horas. Me levantaba de una
    discusión con el estómago cerrado toda la tarde, y la conclusión era
    la misma: soy demasiado intenso.

    Tardé en ver que no era cierto. Una emoción dejada en paz sube, llega
    a un pico y afloja. Lo que la estira soy yo: repasar la escena,
    ensayar lo que debí decir.

    No era la emoción la que duraba seis horas. Era la historia que me
    contaba sobre ella.

    Ahora tengo una señal. Cuando estoy sintiendo, hay algo en el cuerpo:
    el pecho, el estómago. Cuando estoy dando vueltas, hay frases.

    Antes tampoco le ponía nombre a lo que sentía, por miedo a agrandarlo.
    Pasa al revés: lo que tiene nombre tiene bordes.

    No sentí menos desde entonces. Dejé de agregarle horas.

    Si algo te dura toda la tarde, fíjate si todavía lo estás sintiendo o
    ya te lo estás contando. Solo una de las dos se puede soltar.

- id: sem-02
  dia: martes
  capitulo: ansiedad
  titulo: El noventa y uno por ciento no ocurrió
  texto: >-
    Hubo un tiempo en que me acostaba a las dos de la mañana resolviendo
    cosas. Eso sentía: que resolvía. Repasaba la conversación del día
    siguiente, hacía cuentas por si salía mal. Me dormía a las cuatro con
    la sensación de haber trabajado.

    A la mañana siguiente no había ni una decisión tomada.

    Lo que me cambió fue un número. A veintinueve personas con ansiedad
    les pidieron anotar sus preocupaciones diez días, y después
    comprobaron una por una qué pasó.

    El noventa y uno por ciento no ocurrió.

    No dice que nunca pase nada malo. Dice que mi cálculo está torcido, y
    que lo único que ocurrió siempre fue preocuparme.

    Prepararse termina en algo que puedo hacer: una llamada, una cifra.

    Esta noche, cuando la cabeza arranque: ¿cuál es el paso? Si no hay
    ninguno, no estás preparando. Estás pagando por adelantado algo que
    casi nunca llega.

- id: sem-03
  dia: miercoles
  capitulo: autoestima
  titulo: El tono con el que me hablo
  texto: >-
    Hay una conversación que tengo todos los días y que nunca llamé así.
    Dura dos segundos y pasa cuando se me cae algo.

    Un día me escuché. No lo que me decía, que ya lo sabía: el tono.

    Era un tono que no le toleraría a nadie. Si un conocido me hablara
    así, dejaría de verlo.

    Y lo defendí mucho tiempo: pensaba que esa dureza era lo que me
    mantenía funcionando.

    Es falso, y hay datos. La autocrítica dura no mejora lo que hago: hace
    que lo postergue.

    Lo que me sirvió no fue repetirme que soy maravilloso. Fue una
    pregunta: qué le diría a alguien que quiero en mi situación. Le diría
    que es normal, que duele, que no define nada.

    Esa es la parte incómoda. Conmigo uso otra vara, y no la elegí: me la
    dieron.

    La próxima vez que se te caiga algo, no escuches lo que te dices.
    Escucha el tono. Ahí está casi todo, y es lo único que hace falta
    cambiar.

- id: sem-04
  dia: jueves
  capitulo: limites
  titulo: No era la factura de la taza
  texto: >-
    Me pasó más de una vez: estallar un martes por una taza con una fuerza
    que no le correspondía.

    La otra persona se quedaba sin entender, y con razón. Lo que recibía
    no era la factura de la taza. Era la de ocho meses.

    Detrás de cada estallido había una lista: las veces que dije que sí
    sin querer.

    Creía que decir que sí era ser generoso. Era un préstamo que cobraba
    después con frialdad, o con un reproche tardío y por otra cosa.

    Lo que aprendí es de tiempos, no de carácter. Una molestia dicha el
    mismo día es una frase. Guardada tres meses, un expediente.

    Aprendí a cambiar una palabra: donde iba a decir «eres», decir
    «cuando». «Dejaste los platos otra vez» tiene arreglo. «Eres un
    desconsiderado» solo tiene defensa.

    Esa molestia chica que tienes guardada: dila mientras todavía es una
    frase. En tres meses ya no vas a poder decirla sin que suene a
    reproche.

- id: sem-05
  dia: viernes
  capitulo: apego
  titulo: Creía que estaba cuidando
  texto: >-
    Hubo una época en que creía que estaba cuidando la relación. Revisaba
    a qué hora se había conectado. Contaba cuánto tardaba en contestar.

    Eso no era cuidar. Era vigilar, y no lo sabía porque mientras lo hacía
    parecía sensatez.

    Buscaba tranquilidad y conseguía lo contrario. Ninguna comprobación me
    duraba más de un rato, y siempre había una siguiente. Y el otro se
    sentía examinado y se volvía más cuidadoso.

    El miedo a perder a alguien termina empujándolo. No porque el otro sea
    intolerante: nadie se relaja siendo medido.

    Me llevó tiempo entender de dónde venía. Aprendí a querer antes de
    saber hablar, mirando lo que pasaba cuando lloraba: si venía alguien y
    cuándo.

    Lo único que me sirvió fue cambiar de verbo. Donde quería comprobar,
    preguntar.

    Si hoy te ibas a quedar mirando a qué hora se conectó, pregúntale. Da
    más miedo y dura menos, y es lo único que puede terminar en una
    respuesta.

- id: sem-06
  dia: sabado
  capitulo: habitos
  titulo: Las ganas vienen después
  texto: >-
    Esperé las ganas durante años. Iba a caminar cuando tuviera ganas, a
    escribir cuando tuviera ganas, a ordenar la casa cuando tuviera ganas.
    Y cuando no llegaban, la conclusión era sobre mí: me falta disciplina.

    El orden estaba al revés. Las ganas no vienen antes de empezar: vienen
    después, cuando uno ya está adentro. Esperarlas es esperar un permiso
    que no va a llegar.

    Lo otro que me sacó del lugar fue dejar de pelear con mi voluntad. Un
    hábito no se sostiene con fuerza: se sostiene con un lugar, una hora y
    una señal. Y con un tamaño tan chico que no se pueda fallar. El
    entorno gana casi siempre: lo que está a la vista se hace.

    Y los días que fallo, que son muchos, aprendí algo. Fallar un día no
    borra nada. Lo que borra un hábito es lo que decido después.

    No esperes las ganas. Empieza tan pequeño que te dé vergüenza
    contarlo, y deja que las ganas te alcancen adentro. Nunca llegan
    antes.

- id: sem-07
  dia: domingo
  capitulo: duelo
  titulo: El hueco no se achica
  texto: >-
    Cuando perdí a alguien, lo primero que me dieron fue un mapa. Cinco
    etapas en orden, y la sensación de que había que ir cumpliéndolas.

    Ese mapa me hizo daño. Me pasaba el día calificándome: debería estar
    ya en la cuarta, y ayer fue peor que el primero.

    El duelo no tiene etapas. Tiene días. Y los días no vienen con
    instrucciones: una mañana llorando y una tarde resolviendo papeles con
    una eficacia que después da culpa.

    Y tampoco se supera. El hueco no se achica nunca: lo que se hace más
    grande es todo lo demás, alrededor.

    Sigue entero cuando lo toco. Solo que ahora es parte de algo mucho más
    grande.

    Mis amigos dejaron de decir su nombre por miedo a lastimarme, y no
    podían recordarme algo que no olvidé.

    Y si quien está en duelo es alguien que quieres, di su nombre. No le
    recuerdas nada que no recuerde cada día. Es lo más útil que puedes
    hacer, y es gratis.
